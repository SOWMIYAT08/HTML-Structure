<!DOCTYPE html>
<html>
    <head>
        <title>html Structure</title>
        <style>
            nav{
                background-color: red;
                height: 50px;
                width: 600px;
                text-align: center;
            }
            aside{
                background-color: black;
                width: 100px;
                height: 200px;
                text-align: center;
                color: white;
                
            }
            footer{
                background-color: orange;
                width: 600px;
                height: 100px;
                text-align: center;
            }
            main{
                background-color: yellow;
               flex: 1;
            
            }
        </style>
    </head>
    <body>
        <br>
        <nav><b>Navbar</b></nav>
        <section style="width: 600px; display: flex;">
        <aside>Sidebar</aside>
        <main>Content</main>
       </section>
        <footer><b>Footer</b></footer>
    </body>
</html>
